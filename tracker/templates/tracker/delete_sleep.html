{% extends "tracker/layout.html" %}

{% block title %}
Delete Sleep
{% endblock %}


{% block content %}

<h2>Delete Sleep Entry</h2>

<p>
    Are you sure you want to delete this sleep entry?
</p>

<p>
    {{ sleep_entry.hours_slept }} hours -
    {{ sleep_entry.quality }}
</p>


<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, delete
    </button>

</form>


<a href="{% url 'sleep' %}">
    Cancel
</a>


{% endblock %}
