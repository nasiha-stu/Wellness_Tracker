{% extends "tracker/layout.html" %}

{% block content %}

<h2>Delete Hydration Entry?</h2>

<p>
Are you sure you want to delete:
</p>

<p>
{{ hydration.drink_type }}
{{ hydration.amount }}
{{ hydration.unit }}
</p>


<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>


<a href="{% url 'hydration' %}">
    Cancel
</a>


{% endblock %}
