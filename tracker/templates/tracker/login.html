
{% extends "tracker/layout.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h2>Welcome back 🌱</h2>

<form method="POST">

    {% csrf_token %}

    {% if error_message %}
        <p class="error">{{ error_message }}</p>
    {% endif %}

    <label>Username:</label>
    <input type="text" name="username">

    <br>

    <label>Password:</label>
    <input type="password" name="password">

    <br>

    <button type="submit">
        Login
    </button>

</form>

{% endblock %}
